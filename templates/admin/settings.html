{% extends "admin/base_admin.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="admin-top">
  <h1 style="font-size:1.5rem;">Website Settings</h1>
</div>

<div class="card" style="padding:24px; max-width:640px;">
  <form method="post">
    <div class="form-group"><label>Website Name</label><input type="text" name="site_name" class="form-control" value="{{ settings.site_name }}"></div>
    <div class="form-group"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ settings.phone }}"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" value="{{ settings.email }}"></div>
    <div class="form-group"><label>Address</label><input type="text" name="address" class="form-control" value="{{ settings.address }}"></div>
    <div class="form-group"><label>TikTok URL</label><input type="url" name="tiktok" class="form-control" value="{{ settings.tiktok }}"></div>
    <div class="form-group"><label>Facebook URL</label><input type="url" name="facebook" class="form-control" value="{{ settings.facebook }}"></div>
    <div class="form-group"><label>Hero Title</label><input type="text" name="hero_title" class="form-control" value="{{ settings.hero_title }}"></div>
    <div class="form-group"><label>Hero Subtitle</label><input type="text" name="hero_subtitle" class="form-control" value="{{ settings.hero_subtitle }}"></div>
    <div class="form-group"><label>About Text</label><textarea name="about_text" class="form-control" rows="4">{{ settings.about_text }}</textarea></div>
    <div class="form-group"><label>Delivery Areas</label><input type="text" name="delivery_areas" class="form-control" value="{{ settings.delivery_areas }}"></div>
    <div class="form-group"><label>Delivery Charge (NPR)</label><input type="number" name="delivery_charge" class="form-control" value="{{ settings.delivery_charge }}"></div>
    <div class="form-group"><label>Footer Text</label><input type="text" name="footer_text" class="form-control" value="{{ settings.footer_text }}"></div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
