<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Ratuwamai</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="padding-bottom:0;">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo"><span class="logo-icon">🍜</span> Admin</div>
      <nav class="admin-nav">
        <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">📊 Dashboard</a>
        <a href="{{ url_for('admin_orders') }}" class="{% if 'order' in request.endpoint %}active{% endif %}">📦 Orders</a>
        <a href="{{ url_for('admin_foods') }}" class="{% if 'food' in request.endpoint %}active{% endif %}">🍽️ Foods</a>
        <a href="{{ url_for('admin_categories') }}" class="{% if 'categor' in request.endpoint %}active{% endif %}">📁 Categories</a>
        <a href="{{ url_for('admin_delivery_boys') }}" class="{% if 'delivery_boy' in request.endpoint %}active{% endif %}">🛵 Delivery Boys</a>
        <a href="{{ url_for('admin_banners') }}" class="{% if 'banner' in request.endpoint %}active{% endif %}">🖼️ Banners</a>
        <a href="{{ url_for('admin_settings') }}" class="{% if 'settings' in request.endpoint %}active{% endif %}">⚙️ Settings</a>
        <a href="{{ url_for('index') }}" target="_blank">🌐 View Website</a>
        <a href="{{ url_for('admin_logout') }}">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}
          <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
